submission:
  title: "Supply Chain Disruption Assistant & Fleet Utilisation Optimizer"

  problem_statement: >
    Logistics teams lack a unified real-time view that combines shipment disruption
    signals, actionable reroute recommendations, idle fleet detection, and cold-chain
    temperature breach alerts — leading to delayed responses, spoiled goods, and
    poor fleet utilisation.

  solution_summary: >
    A zero-dependency local Python dashboard (python src/app.py) that generates
    synthetic supply-chain telemetry, runs rule-based detection across four disruption
    categories, and surfaces actionable recommendations in an auto-refreshing browser UI
    with no cloud, database, or install step required.

  key_features:
    - "Shipment disruption detection — flags delayed and blocked consignments automatically"
    - "Rerouting recommendations — suggests specific alternate routes with plain-English reasons"
    - "Idle fleet detection — identifies vehicles idle beyond a configurable threshold"
    - "Cold-chain temperature alerts — monitors reefer trucks and raises directional breach alerts"
    - "Live auto-refreshing dashboard — single-page UI with KPI cards and colour-coded tables"

  tech_stack:
    languages: ["Python 3.x"]
    frameworks: ["Python http.server (stdlib)", "Vanilla JavaScript"]
    ibm_technologies: ["IBM Bob"]
    databases: []
    other: ["HTML5", "CSS3"]

  what_we_are_most_proud_of: >
    The entire solution runs with a single command — python src/app.py — with zero pip
    installs, zero config, and zero cloud dependencies. Despite this constraint it
    delivers all five required capabilities in a clean, readable UI that auto-refreshes
    every 10 seconds. The clean separation between data.py, engine.py, and app.py makes
    it straightforward to swap in real data sources later.

  known_limitations: >
    All data is synthetic and deterministic — not connected to real shipment systems.
    Reroute recommendations are rule-based lookup tables, not ML-driven.
    No authentication or multi-user support — single-user local tool only.

